name: Daily dental dataset discovery
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-dataset-discovery.yml"
      - "scripts/discover_datasets.py"
  schedule:
    # 06:00 UTC = 09:00 Cairo standard time; GitHub schedule may run late.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: dental-dataset-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search public metadata feeds
        run: python scripts/discover_datasets.py
      - name: Commit refreshed unverified discovery feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/auto_discovery.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(discovery): refresh dental and maxillofacial source metadata [skip ci]"
            git push
          fi
