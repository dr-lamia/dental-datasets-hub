name: Weekly dental dataset review

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-and-open-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalogue
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate catalogues and check source links
        id: audit
        run: python scripts/check_catalog.py

      - name: Open weekly curation issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Weekly dental dataset catalogue review — ${today}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });
            if (existing.data.some(issue => issue.title === title)) {
              core.info("A review issue for this date already exists.");
              return;
            }
            const auditState = "${{ steps.audit.outcome }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "This issue was opened by the scheduled weekly catalogue maintenance workflow.",
              "",
              `- Link audit result: **${auditState}**`,
              `- [View the workflow run and link-audit report](${runUrl})`,
              "",
              "## Curator checklist",
              "- Review broken or inconclusive links in the audit.",
              "- Search approved dataset sources for newly released dental and oral-health datasets.",
              "- Verify each candidate on its original dataset page and publication.",
              "- Check access conditions, licence, modality, labels, and the unit behind every count.",
              "- Add verified records or corrections to the specialty catalogue and update `UPDATE_LOG.md`.",
              "- Leave unresolved details marked as unclear; do not infer them.",
              "",
              "The workflow checks links and CSV structure. It does not add or change scientific metadata automatically."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["weekly-review"]
            });
